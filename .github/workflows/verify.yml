# CI Quizey — 2026-08-22 (évaluation qualitative : « tests + CI »)
# Le dépôt est un fichier unique autonome : pas de build, pas de dépendances.
# La seule porte de qualité automatisable = la suite de vérification Node
# (vm + DOM factice) qui exécute réellement les deux blocs <script> de
# Quizey.html et contrôle le moteur sur DOM simulé.
name: Vérification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Suite de vérification
    runs-on: ubuntu-latest
    steps:
      - name: Clonage
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: node _qz_verify.js
        run: node _qz_verify.js
