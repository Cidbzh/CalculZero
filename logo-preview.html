<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Quizio — Kit logo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,500;0,600;0,700;1,500&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16233D; --paper:#F6F8FC; --line:#D9E1EF; --muted:#5A6B87;
    --accent:#2563EB; --pc:#7C3AED; --de:#047857;
    --f-disp:"STIX Two Text",Georgia,serif; --f-body:"Instrument Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  body{background:#E8EDF6;font-family:var(--f-body);color:var(--ink);padding:48px 28px}
  .sheet{max-width:1060px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:44px;box-shadow:0 24px 60px rgba(22,35,61,.10)}
  h1{font:700 30px/1.2 var(--f-disp);letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:14.5px;margin:6px 0 30px}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
  .tile{border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;min-height:150px;padding:18px;position:relative}
  .tile .tag{position:absolute;left:12px;bottom:9px;font:600 10.5px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .tile.dark{background:#101B33;border-color:#243352}
  .tile.dark .tag{color:#8FA3C8}
  .tile.accent{background:var(--accent);border-color:var(--accent)}
  .tile.accent .tag{color:rgba(255,255,255,.75)}
  .lockup{display:flex;align-items:center;gap:12px}
  .word{font:700 34px/1 var(--f-disp);letter-spacing:-.01em;white-space:nowrap}
  .word em{font-style:normal;color:var(--accent)}
  .tile.dark .word{color:#F2F6FD}
  .tile.dark .word em{color:#60A5FA}
  .mats{display:flex;gap:14px;align-items:center}
  .sizing{display:flex;align-items:flex-end;gap:26px}
  .sizing figure{display:flex;flex-direction:column;align-items:center;gap:8px}
  .sizing figcaption{font:600 11px var(--f-body);color:var(--muted)}
  .h{grid-column:1/-1;font:600 11px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:22px}
  .full{grid-column:1/-1}
  svg{display:block}
</style>
</head>
<body>
  <div class="sheet">
    <h1>Quizio — le « Q à la plume »</h1>
    <p class="sub">L'interrogation (l'anneau) croisée par la signature de l'app — le même trait que sous « <em>tu sais.</em> » — qui s'envole. Encre <b>#16233D</b> + accent <b>#2563EB</b>.</p>
    <div class="grid" id="g"></div>
  </div>
<script>
const MARK=(ink,pen,size)=>`<svg width="${size}" height="${size}" viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="29" cy="28" r="19" stroke="${ink}" stroke-width="7"/><path d="M23 33 C31 44, 45 47, 55 35" stroke="${pen}" stroke-width="7"/></g></svg>`;
const INK="#16233D",PEN="#2563EB",INKD="#F2F6FD",PENS="#60A5FA";
const g=document.getElementById("g");
const tile=(cls,tag,inner)=>`<div class="tile ${cls}"><div>${inner}</div><span class="tag">${tag}</span></div>`;
let h="";
h+=`<div class="h">Marque — fond clair / fond sombre / fond accent</div>`;
h+=tile("","clair",MARK(INK,PEN,72));
h+=tile("dark","sombre",MARK(INKD,PENS,72));
h+=tile("accent","sur accent (monochrome)",MARK("#FFFFFF","#FFFFFF",72));
h+=`<div class="h">Verrou (mark + mot) — « io » en accent</div>`;
h+=tile("full","clair",`<div class="lockup">${MARK(INK,PEN,44)}<span class="word">Quiz<em>io</em></span></div>`);
h+=tile("full dark","sombre",`<div class="lockup">${MARK(INKD,PENS,44)}<span class="word">Quiz<em>io</em></span></div>`);
h+=`<div class="h">La plume suit la matière</div>`;
h+=tile("full","maths #2563EB · PC #7C3AED · DE #047857",`<div class="mats">${MARK(INK,PEN,56)}${MARK(INK,"#7C3AED",56)}${MARK(INK,"#047857",56)}</div>`);
h+=`<div class="h">Tailles — lisible jusqu'au favicon (16 px)</div>`;
h+=tile("full","16 / 24 / 32 / 64 / 128",`<div class="sizing">${[16,24,32,64,128].map(s=>`<figure>${MARK(INK,PEN,s)}<figcaption>${s}px</figcaption></figure>`).join("")}</div>`);
g.innerHTML=h;
</script>
</body>
</html>
