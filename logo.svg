<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Quizio — logo">
  <!-- Quizio — le « Q à la plume »
       Anneau = l'interrogation (quiz). Plume = la signature de l'app
       (le trait sous « tu sais. ») : elle traverse l'anneau et s'envole.
       Deux teintes : encre #16233D + accent #2563EB (maths ; violet/vert en PC/DE). -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="29" cy="28" r="19" stroke="#16233D" stroke-width="7"/>
    <path d="M23 33 C31 44, 45 47, 55 35" stroke="#2563EB" stroke-width="7"/>
  </g>
</svg>
